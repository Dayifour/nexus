name: Release

# Publie une version téléchargeable : pousser un tag `vX.Y.Z` (ou lancer à la main) construit l'application sur Linux,
# Windows et macOS, puis crée la Release GitHub avec les fichiers à télécharger.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # Version de pnpm lue dans package.json (« packageManager »).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Outils de paquet Linux (.deb, .rpm)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm
      - name: Installation reproductible
        run: pnpm install --frozen-lockfile
      - name: Client Prisma et migrations embarquées
        run: pnpm run generate
      - name: Construction des paquets
        run: pnpm --filter @nexus/desktop run make
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-${{ matrix.name }}
          path: |
            apps/desktop/out/make/**/*.deb
            apps/desktop/out/make/**/*.rpm
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.nupkg
            apps/desktop/out/make/**/RELEASES
          if-no-files-found: error

  release:
    needs: build
    # Windows et macOS restent expérimentaux : une plateforme en échec ne doit pas priver les autres de leur Release.
    # On publie dès qu'au moins une construction a réussi (les fichiers absents sont simplement ignorés).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Empreintes SHA-256
        run: find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.exe' \) -exec sha256sum {} + | sed 's#dist/[^ ]*/##' > dist/SHA256SUMS.txt && cat dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          # Sur un tag : Release publiée ; lancement manuel : brouillon à relire.
          draft: ${{ github.event_name != 'push' }}
          generate_release_notes: true
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.zip
            dist/**/*.exe
            dist/SHA256SUMS.txt
